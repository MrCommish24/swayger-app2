    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Swayger — Social Wager Contracts</title>
    <meta name="description" content="Swayger is the app for locking in takes and proving who was right. Make 1v1 social wager contracts with friends, join the NBA picks challenge, and track every outcome — no real money, just bragging rights." />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swayger" />
    <meta property="og:title" content="Swayger — Social Wager Contracts" />
    <meta property="og:description" content="Make 1v1 social wager contracts with friends. Lock in your pick, challenge someone, and settle it. Join the NBA picks challenge — no real money, just bragging rights." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Swayger — Social Wager Contracts" />

    <meta name="twitter:image" content="/assets/images/icon.png" />

    <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "6c7fe969-e694-4977-819a-f10fbc4159c6",
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "/OneSignalSDKWorker.js",
        });
      });
    </script>

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <div id="root"></div>
