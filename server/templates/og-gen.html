<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:wght@500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #09090B;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .mark {
    width: 120px;
    height: 120px;
    margin-bottom: 16px;
  }
  .wordmark {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 108px;
    letter-spacing: 14px;
    color: #FAFAFA;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 8px;
  }
  .underline {
    width: 100%;
    height: 4px;
    background: #4361EE;
    border-radius: 2px;
    margin-bottom: 18px;
  }
  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 7px;
    color: #4361EE;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="logo-block">
    <svg class="mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="9" y="34" width="12" height="12" rx="2" fill="#FAFAFA"/>
      <polygon points="25,55 36,60 55,25 44,20" fill="#FAFAFA"/>
      <rect x="59" y="34" width="12" height="12" rx="2" fill="#FAFAFA"/>
    </svg>
    <div class="wordmark">SWAYGER</div>
    <div class="underline"></div>
    <div class="tagline">LOCK IT IN. STAND ON IT.</div>
  </div>
</body>
</html>
